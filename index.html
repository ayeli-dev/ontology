<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>边端分发 · 本体构建与运营</title>
  <style>:root {
  --blue:#184ff2; --pale:#edf5ff; --ink:#0f131f; --text:#292f42; --muted:#646f85;
  --line:#dfe2eb; --rule:#e9edf4; --bg:#f6f8fc; --rail:200px; --radius:6px;
  font:14px/1.55 "PingFang SC","Microsoft YaHei",Arial,sans-serif;color:var(--text)
}
*{box-sizing:border-box}body{margin:0;background:white}h1,h2,h3,p{margin:0}h1,h2,h3,strong{color:var(--ink)}button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:transparent;padding:0}button:hover,a:hover{color:var(--blue)}a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}button:disabled{opacity:.5;cursor:default}[hidden]{display:none!important}
.mast{position:sticky;top:0;z-index:5;height:56px;background:white;display:flex;align-items:center;padding:0 22px;gap:44px;border-bottom:1px solid var(--line)}
.brand,.mast nav,.node-head,.stats,.pack-toggle,.chip,.actions,.filters,.tabs,.panel-title,.subline,.drawer-top{display:flex;align-items:center}
.brand{gap:10px;color:var(--ink);font-size:17px;font-weight:600;white-space:nowrap}.brand img{width:123px}.brand i{width:1px;height:17px;background:var(--line)}.mast nav{height:100%;gap:25px;white-space:nowrap}.mast nav strong{height:100%;border-bottom:3px solid var(--blue);padding-top:17px}
.rail{position:fixed;left:0;top:56px;bottom:0;width:var(--rail);background:#f5f7fc;border-right:1px solid var(--line);display:flex;flex-direction:column;padding:14px 10px 0}
.project{background:white;border:1px solid var(--line);border-radius:5px;padding:7px 10px;color:var(--ink);font-size:13px;margin-bottom:8px}.rail nav{flex:1;overflow:auto}.group{margin:20px 9px 6px;color:var(--muted);font-size:12px}.nav-item{display:flex;align-items:center;gap:10px;height:38px;padding:0 10px;border-radius:4px;white-space:nowrap}.nav-item img{width:18px;height:18px}.nav-item.current{color:var(--blue);background:#e8efff;font-weight:600}.current img{filter:brightness(0) saturate(100%) invert(22%) sepia(83%) saturate(3839%) hue-rotate(222deg)}#fold{border-top:1px solid var(--line);height:38px;text-align:left;padding-left:10px;font-size:18px}
main{margin-left:var(--rail);min-width:0;background:white;min-height:calc(100vh - 56px)}
.page-heading{padding:22px 24px 10px}
h1{font-size:20px;line-height:30px;font-weight:600;margin:0}
.tabs{gap:32px;background:white;border-bottom:1px solid var(--line);padding:0 24px;overflow:auto}
.tabs a{display:flex;align-items:center;gap:6px;position:relative;height:48px;white-space:nowrap}.tabs a.active{color:var(--blue);font-weight:600}.tabs a.active:after{content:'';height:2px;background:var(--blue);position:absolute;bottom:0;left:0;right:0;border-radius:2px}.pending-tag{padding:0 6px;border-radius:3px;font-size:12px;font-weight:400;line-height:18px;color:#986209;background:#fff3d9}
#view{min-width:0}
#view:has(.graph){margin:24px;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.graph-scroll{height:calc(100dvh - 224px);min-height:440px;overflow:auto;background-color:#fbfcff;background-image:radial-gradient(#d8dfeb .85px,transparent .85px);background-size:16px 16px;position:relative}
.graph{position:relative;isolation:isolate;min-width:690px;min-height:100%;display:flex;align-items:center;justify-content:space-between;padding:42px clamp(32px,6vw,112px);gap:64px}
.lines{position:absolute;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none}.lines path{fill:none;stroke-width:1.6}.node{position:relative;background:#fff;border:1px solid #cad3e3;border-radius:8px;box-shadow:0 2px 6px #192d5610}
.hub{width:310px;flex-shrink:0;border-color:#aac2fd}.hub-header{background:linear-gradient(105deg,#edf3ff,#fafcff);border-radius:8px 8px 0 0;padding:16px}.node-head{gap:10px}.node-head small{font-size:12px;color:var(--muted);display:block}.node-head h2{font-size:16px}.glyph{display:grid;place-items:center;background:#eaf0fe;border-radius:8px;color:var(--blue);width:36px;height:36px;flex-shrink:0}.glyph svg{width:22px;height:22px}.hub .glyph{color:white;background:var(--blue)}.more{margin-left:auto;align-self:flex-start;font-weight:bold;color:var(--muted);padding:0 5px;font-size:16px;letter-spacing:1px}.more:hover{background:var(--pale);border-radius:4px}
.stats{gap:26px;padding:12px 16px}.stats small,.meta{font-size:12px;color:var(--muted)}.stats b{display:block;font:600 20px/1.15 Arial;color:var(--ink);font-variant-numeric:tabular-nums}.stats small{display:block;margin-top:4px}
.pack-toggle{width:100%;padding:9px 16px;border-top:1px solid var(--rule);justify-content:space-between;font-size:13px;font-weight:600;color:var(--text)}.pack-toggle span:last-child{color:var(--blue);font-weight:400}.pack-list{padding:0 0 6px}.pack-row{width:100%;position:relative;display:flex;align-items:center;gap:9px;text-align:left;padding:4px 16px;min-height:29px;font-size:13px}.pack-row .id{font:12px/18px ui-monospace,monospace;color:var(--muted)}.pack-row .name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pack-row .site-count{margin-left:auto;color:var(--muted);font-size:12px;white-space:nowrap}.pack-row.active,.pack-row:hover{background:var(--pale);color:var(--blue)}.pack-row.active .site-count{color:var(--blue)}.pack-row.connected:after,.site-node:before{content:'';position:absolute;background:white;border:1.5px solid #86a5eb;border-radius:50%;height:6px;width:6px;top:50%;transform:translateY(-50%)}.pack-row.connected:after{right:-4px}.site-node:before{left:-5px}
.sites{display:grid;gap:18px;width:min(265px,30%);min-width:205px}.site-node{padding:12px 14px;transition:border-color .15s,opacity .15s}.site-node.match{border-color:var(--blue);box-shadow:0 0 0 2px #184ff216}.site-node.faded{opacity:.55}.site-node .glyph{width:33px;height:33px;background:#eff3fa;color:#506481}.site-node .node-head>button.name{text-align:left;min-width:0}.site-node strong{display:block;font-size:15px}.site-node .name small{font:11px/1.6 ui-monospace,monospace}.subline{border-top:1px solid var(--rule);margin-top:10px;padding-top:9px;justify-content:space-between;gap:6px;flex-wrap:wrap;font-size:12px}.subline .load{color:var(--text)}.load b{font-family:Arial;color:var(--blue);font-size:14px;margin-left:4px}.online{color:#067c60;font-size:12px}.offline{color:#6b7385;font-size:12px}.online:before,.offline:before{content:'';display:inline-block;margin-right:4px;background:#0ea87b;width:6px;height:6px;border-radius:50%}.offline:before{background:#9aa4b6}
.tag{display:inline-flex;align-items:center;border-radius:3px;line-height:20px;padding:0 6px;font-size:12px;white-space:nowrap;background:#edf3ff;color:#3153a8}.tag.ok{background:#e8f7f0;color:#117a54}.tag.bad{background:#fff0ef;color:#be3931}.tag.wait{background:#fff4dc;color:#91640d}.legend{display:flex;align-items:center;gap:8px;padding:7px 16px;font-size:12px;color:var(--muted);border-top:1px solid var(--rule)}.legend i{width:26px;height:2px;background:#829dd6}.legend span:last-child{margin-left:auto}
.list{padding:24px}.filters{gap:8px 32px;margin-bottom:16px;flex-wrap:wrap;justify-content:space-between}.actions{margin-left:auto;gap:8px}.btn,.dialog-foot button,select,input:not([type=file]){border:1px solid #c9cfdb;border-radius:4px;background:#fff;height:32px;padding:0 11px}.primary,.dialog-foot button.primary{color:white;background:var(--blue);border-color:var(--blue)}.primary:hover{background:#3967ee;color:white}.btn:hover{border-color:var(--blue)}.filters input{width:220px}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:14px}.list th,.list td,.drawer td,.drawer th{text-align:left;padding:12px 11px;border-bottom:1px solid var(--rule);white-space:nowrap}th{font-weight:500;color:var(--muted);font-size:13px;background:#f5f7fb}tbody tr:hover{background:#f6f9ff}.cell-name{display:block;text-align:left;font-weight:500;color:var(--ink)}tbody tr:hover .cell-name,.link{color:var(--blue)}.link+.link{margin-left:14px}.meta{display:block}.empty{text-align:center!important;color:var(--muted);padding:40px!important}.menu{position:fixed;background:white;border:1px solid var(--line);border-radius:5px;padding:4px;box-shadow:0 5px 20px #172b4d25;z-index:9;min-width:130px}.menu button{display:block;width:100%;padding:7px 12px;text-align:left}.menu button:hover{background:var(--pale)}.danger{color:#c63932}
dialog{color:var(--text);border:none;border-radius:8px;padding:24px;width:min(430px,96vw);box-shadow:0 12px 36px #1124462b}dialog::backdrop{background:#15254040}dialog h2{font-size:18px}.drawer{margin:0 0 0 auto;width:min(460px,100vw);max-width:100vw;height:100dvh;max-height:none;border-radius:0;padding:22px;overflow:auto}.drawer-top{justify-content:space-between;margin-bottom:20px}.x{font-size:22px;color:var(--muted)}.drawer h3{font-size:14px;margin:24px 0 10px}.drawer table{font-size:13px}.drawer dl{display:grid;grid-template-columns:100px 1fr;gap:12px}.drawer dt{color:var(--muted)}.drawer dd{margin:0}.dialog-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:24px}.field{display:grid;gap:6px;margin-top:15px}#form-body p{margin:12px 0}.danger-btn{background:#be3931!important;border-color:#be3931!important}#toast{position:fixed;z-index:12;top:66px;left:50%;transform:translateX(-50%);padding:9px 18px;border:1px solid var(--line);background:#fff;border-radius:5px;box-shadow:0 4px 14px #14234021}.collapsed{--rail:54px}.collapsed .rail .group,.collapsed .rail .project,.collapsed .nav-item span{display:none}.collapsed .rail{padding-inline:6px}.collapsed .rail nav{padding-top:8px}
@media(max-width:1180px){.graph{padding-inline:32px}.mast nav{gap:15px}.mast{gap:20px}}
@media(max-width:900px){:root{--rail:54px}.rail .project,.rail .group,.rail .nav-item span{display:none}.rail{padding-inline:6px}.mast nav span{display:none}.mast{gap:16px}.tabs{gap:20px}}
@media(max-width:600px){.rail,.mast nav{display:none}main{margin:0}.tabs{gap:14px;padding:0 10px;font-size:13px}.graph-scroll{min-height:400px}.list{padding:12px}.filters input{width:100%}.mast{height:48px;padding:0 12px}.legend{flex-wrap:wrap}.filters .actions{margin-left:0}}
.hub-expand{text-align:left;flex:1}.hub-expand strong{font-size:16px}.hub-expand:hover strong{color:var(--blue)}

/* 通用场景 · 表格列表 */
.search-tools,.search-box,.column-filter,.pager,.filter-summary{display:flex;align-items:center}
.search-tools,.filter-summary,.pager{gap:8px}
.search-box{height:32px;width:240px;border:1px solid #c3c7d4;border-radius:3px;overflow:hidden}
.search-box:focus-within{border-color:var(--blue)}
.filters .search-box input{width:100%;height:30px;min-width:0;border:none;outline:0;padding:0 8px}
.search-box button,.icon-button{display:grid;place-items:center;width:32px;height:32px;flex:none}
.search-tools img,.column-filter img{width:16px;height:16px}.icon-button{padding:0}
.filter-summary{margin:0 0 12px;flex-wrap:wrap}.filter-chip{background:#f5f7fc;border:1px solid var(--line);padding:1px 7px;border-radius:3px;font-size:12px}
.column-filter{display:inline-flex;position:relative;gap:6px}.column-filter select{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
.column-filter:focus-within{outline:2px solid var(--blue)}.column-filter:has(option:checked:not([value=""])){color:var(--blue)}
.list .table-wrap{overflow-x:auto}.list table{border-collapse:separate;border-spacing:0}
.list th,.list td{background:white;border-color:var(--line);padding:0 16px;height:48px;color:var(--text)}
.list th{height:40px;font-size:14px;font-weight:600;color:var(--ink)}
.list tbody tr:hover td{background:var(--pale)}
.list .has-actions :is(th,td):last-child:not([colspan]){position:sticky;right:0}
.list .tag{background:none;color:var(--text);padding:0;font-size:14px;gap:8px}
.list .tag:before{content:'';width:8px;height:8px;border-radius:50%;background:var(--blue)}
.list .tag.ok:before{background:#0cbf92}.list .tag.bad:before{background:#f53f3f}.list .tag.wait:before{background:#ff9a2e}
.list .empty img{display:block;width:48px;margin:12px auto}
.pager{justify-content:flex-end;margin-top:16px;flex-wrap:wrap;color:var(--muted)}
.pager button{min-width:32px;height:32px;border-radius:3px}
.pager button[aria-current=page]{color:var(--blue);background:var(--pale)}
.pager button:disabled{color:#c3c7d4}.pager input{width:48px;text-align:center;padding:0 4px}
.pager .jump{margin:0}.pager select,.pager input{border-color:#c3c7d4}
@media(max-width:600px){.page-heading{padding:16px 12px 4px}.tabs{gap:15px;padding-inline:12px}#view:has(.graph){margin:12px}.list{padding:16px 12px}.search-tools{max-width:100%}.pager{gap:4px}.pager .jump{display:none}}
</style>
</head>

}).join('')).join('');
function notice(message) {
  const el = $('#toast'); el.textContent=message; el.hidden=false;
  clearTimeout(notice.timer); notice.timer=setTimeout(()=>el.hidden=true,2800);
}
function save() {
  try { localStorage.setItem(storageKey,JSON.stringify(db)); }
  catch { notice('本次更改保存在当前页面，浏览器存储空间不足或不可用'); }
}
function route() {
  const [tab,search] = location.hash.slice(1).split('?');
  return {tab:Object.hasOwn(tabs,tab)?tab:'overview', params:new URLSearchParams(search)};
}
function go(tab, filters={}) {
  const query=new URLSearchParams(Object.entries(filters).filter(([,value])=>value)).toString();
  location.hash=tab+(query?'?'+query:'');
}
const siteById=id=>db.sites.find(s=>s.id===id);
const packageById=id=>db.packages.find(p=>p.id===id);
function siteName(id) {return siteById(id)?.name || db.tasks.find(t=>t.site===id)?.siteName || id;}
function installed(siteId) {
  const result=new Map();
  for(const task of db.tasks) if(task.site===siteId && task.status==='完成') result.set(task.pkg,task);
  return [...result.values()];
}
function destinations(id) {return db.sites.filter(s=>installed(s.id).some(t=>t.pkg===id));}
const statusClass = {'完成':'ok','已审阅':'ok','失败':'bad','等待安装':'wait','待审阅':'wait'};
const badge = status=>'<span class="tag '+(statusClass[status]||'')+'">'+escapeText(status)+'</span>';
const act=(name,id,label,cls='link')=>'<button type="button" class="'+cls+'" data-act="'+name+'" data-id="'+escapeText(id)+'">'+label+'</button>';
function menuButton(id,label){return '<button class="more" data-act="menu" data-id="'+id+'" aria-label="'+escapeText(label)+'更多操作" aria-haspopup="menu">···</button>';}
function renderTabs() {
  const {tab}=route();
  const pending = db.reviews.filter(review => !review.reviewed).length;
  $('#tabs').innerHTML=Object.entries(tabs).map(([key,name])=>{
    const tag = key === 'reviews' && pending > 0 ? '<small class="pending-tag">'+pending+'个待审阅</small>' : '';
    return '<a href="#'+key+'" '+(tab===key?'class="active" aria-current="page"':'')+'>'+name+tag+'</a>';
  }).join('');
}
function siteCard(site) {
  const tasks=db.tasks.filter(t=>t.site===site.id);
  const status=tasks.some(t=>t.status==='失败')?'失败':tasks.some(t=>t.status==='等待安装')?'等待安装':tasks.at(-1)?.status;
  return '<article class="node site-node" data-site="'+site.id+'"><div class="node-head">'+glyph('site')+act('site',site.id,'<strong>'+escapeText(site.name)+'</strong><small>'+site.code+'</small>','name')+menuButton(site.id,site.name)+'</div><div class="subline"><span class="'+(site.online?'online':'offline')+'">'+(site.online?'在线':'离线')+'</span>'+act('site',site.id,'已装载 <b>'+installed(site.id).length+'</b>','load')+(status?'<button data-act="site-tasks" data-id="'+site.id+'" data-status="'+status+'" title="查看本站'+status+'任务">'+badge(status)+'</button>':'')+'</div></article>';
}
function graphView(){
  const count=db.sites.reduce((sum,s)=>sum+installed(s.id).length,0);
  const stats=[[db.packages.length,'模式包'],[db.sites.filter(s=>s.online).length+' / '+db.sites.length,'在线边端'],[count,'装载记录']];
  return '<div class="graph-scroll"><div class="graph"><svg class="lines" aria-hidden="true"></svg><article class="node hub"><div class="hub-header node-head">'+'<button class="hub-expand node-head" data-act="expand" aria-label="展开或收起中心端模式包" aria-expanded="'+ui.expanded+'">'+glyph('hub')+'<span><small>中心端</small><strong>'+escapeText(db.hub)+'</strong></span></button>'+menuButton('hub',db.hub)+'</div><div class="stats">'+stats.map(([n,label])=>'<div><b>'+n+'</b><small>'+label+'</small></div>').join('')+'</div><button class="pack-toggle" data-act="expand" aria-expanded="'+ui.expanded+'"><span>模式包清单</span><span>'+(ui.expanded?'收起 ⌃':'展开 ⌄')+'</span></button>'+(ui.expanded?'<div class="pack-list">'+db.packages.map(p=>{
    const n=destinations(p.id).length;
    return '<button class="pack-row '+(n?'connected':'')+'" data-act="highlight" data-id="'+p.id+'" aria-pressed="false"><span class="id">'+p.id+'</span><span class="name">'+escapeText(p.name)+'</span><span class="site-count">'+n+' 站</span></button>';
  }).join('')+'</div>':'')+'</article><div class="sites">'+(db.sites.map(siteCard).join('')||'<p class="empty">暂无已注册边端</p>')+'</div></div></div><div class="legend"><i></i><span>'+(ui.expanded?'已装载关系':'已注册边端')+'</span><span id="relation-note"></span></div>';
}
function drawLines(preview=''){
  const graph=$('.graph'); if(!graph) return;
  const selected=ui.expanded?(preview||ui.selected):'';
  const bounds=graph.getBoundingClientRect(), paths=[];
  for (const el of graph.querySelectorAll('.pack-row')) {
    el.classList.toggle('active',el.dataset.id===selected);
    el.setAttribute('aria-pressed',String(el.dataset.id===ui.selected));
  }
  for(const node of graph.querySelectorAll('.site-node')){
    const records=installed(node.dataset.site);
    const match=selected && records.some(t=>t.pkg===selected);
    node.classList.toggle('match',Boolean(match));node.classList.toggle('faded',Boolean(selected&&!match));
    const target=node.getBoundingClientRect();
    const sources=ui.expanded?records.map(t=>({el:graph.querySelector('.pack-row[data-id="'+t.pkg+'"]'),id:t.pkg})):[{el:$('.hub'),id:''}];
    for(const [i,{el,id}] of sources.entries()){
      if(!el) continue;
      const src=el.getBoundingClientRect(),x=src.right-bounds.left,y=src.top+src.height/2-bounds.top;
      const tx=target.left-bounds.left,ty=target.top+target.height/2-bounds.top;
      const bend=(tx-x)*(.4+i*.025);
      const color=selected?(selected===id?'#184ff2':'#e0e6f0'):'#94ace0';
      paths.push({active:selected===id,svg:'<path data-pkg="'+id+'" data-edge="'+node.dataset.site+'" stroke="'+color+'" d="M '+x+' '+y+' C '+(x+bend)+' '+y+', '+(tx-bend)+' '+ty+', '+tx+' '+ty+'"/>'});
    }
  }
  $('.lines').innerHTML=paths.sort((a,b)=>Number(a.active)-Number(b.active)).map(p=>p.svg).join('');
  $('#relation-note').textContent=selected?selected+' · '+(destinations(selected).map(s=>s.name).join('、')||'暂无已装载边端'):'';
}
function selectBox(key,label,values,params){
  return '<select aria-label="'+label+'" data-filter="'+key+'"><option value="">'+label+'</option>'+values.map(([id,name])=>'<option value="'+escapeText(id)+'" '+(params.get(key)===id?'selected':'')+'>'+escapeText(name)+'</option>').join('')+'</select>';
}

    columns=['模式包名称','编号','版本','来源场景','快照实例','已装载边端','操作'];
    rows=db.packages.filter(p=>matches(p.id,p.name)&&(!params.get('scene')||p.scene===params.get('scene'))).map(p=>[
      act('package',p.id,escapeText(p.name),'cell-name'),p.id,p.version,escapeText(p.scene),p.count+' 条',destinations(p.id).length+' 个',act('dispatch',p.id,'下发')+act('download',p.id,'下载')
    ]);
  }else if(tab==='tasks'){
    filters['目标边端']=selectBox('site','全部边端',[...new Set(db.tasks.map(t=>t.site).concat(db.sites.map(s=>s.id)))].map(id=>[id,siteName(id)]),params);
    filters['状态']=selectBox('status','全部状态',['已提交','等待安装','完成','失败'].map(v=>[v,v]),params);
    actions=act('dispatch','','＋ 发起分发','btn primary');
    columns=['分发任务','模式包','目标边端','状态','分发时间','装入时间'];
    rows=[...db.tasks].reverse().filter(t=>(!params.get('site')||t.site===params.get('site'))&&(!params.get('status')||t.status===params.get('status'))&&matches(t.id,t.pkg,packageById(t.pkg)?.name,siteName(t.site))).map(t=>[t.id,act('package',t.pkg,escapeText(packageById(t.pkg)?.name),'cell-name'),escapeText(siteName(t.site)),badge(t.status),t.sent,t.loaded||'—']);
  }else{
    filters['状态']=selectBox('status','全部状态',['待审阅','已审阅'].map(v=>[v,v]),params);
    columns=['扩模申请','编号','来源边端','缺口类型','提交方式','状态','提交时间'];
    rows=db.reviews.filter(r=>matches(r.id,r.title,siteName(r.site))&&(!params.get('status')||params.get('status')===(r.reviewed?'已审阅':'待审阅'))).map(r=>[act('review',r.id,escapeText(r.title),'cell-name'),r.id,escapeText(siteName(r.site)),r.type,r.source,badge(r.reviewed?'已审阅':'待审阅'),r.date]);
  }
  const placeholder={packages:'搜索模式包名称或编号',tasks:'搜索任务、模式包或边端',reviews:'搜索扩模申请或来源边端'}[tab];
  const size = [10,20,50].includes(Number(params.get('size'))) ? Number(params.get('size')) : 10;
  const pages = Math.max(1, Math.ceil(rows.length / size));
  const page = Math.min(pages, Math.max(1, parseInt(params.get('page'), 10) || 1));
  const head = columns.map(label => {
    if (!filters[label]) return '<th scope="col">'+label+'</th>';
    return '<th scope="col"><label class="column-filter">'+label+'<img src="'+asset('filter')+'" alt="">'+filters[label]+'</label></th>';
  }).join('');
  const active = ['scene','site','status','q'].filter(key => params.get(key));
  const chips = active.map(key => {
    const value = key==='site' ? siteName(params.get(key)) : params.get(key);
    return act('clear-filter',key,escapeText(value)+' ×','filter-chip');
  }).join('');
  const visible = rows.slice((page-1)*size, page*size);
  const body = visible.map(row => '<tr>'+row.map(cell=>'<td>'+cell+'</td>').join('')+'</tr>').join('');
  return `<div class="list">
    <form class="filters" id="filters">
      <div class="search-tools"><label class="search-box"><input type="search" id="q" aria-label="${placeholder}" placeholder="${placeholder}" value="${escapeText(params.get('q'))}"><button type="submit" aria-label="搜索"><img src="${asset('search')}" alt=""></button></label>
      <button class="btn icon-button" type="button" data-act="refresh" aria-label="刷新列表" title="刷新列表"><img src="data:image/svg+xml;base64,PHN2ZyBwcmVzZXJ2ZUFzcGVjdFJhdGlvPSJub25lIiBvdmVyZmxvdz0idmlzaWJsZSIgc3R5bGU9ImRpc3BsYXk6IGJsb2NrOyIgd2lkdGg9IjE2IiBoZWlnaHQ9IjE2IiB2aWV3Qm94PSIwIDAgMTYgMTYiIGZpbGw9Im5vbmUiIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyI+CjxnIGlkPSJpbnRlcmFjdGl2ZS1idXR0b24vcmVmcmVzaCI+CjxwYXRoIGlkPSJWZWN0b3IiIGQ9Ik04IDMuMzMzMzNDNS40MjI2NyAzLjMzMzMzIDMuMzMzMzMgNS40MjI2NyAzLjMzMzMzIDhDMy4zMzMzMyAxMC41NzczIDUuNDIyNjcgMTIuNjY2NyA4IDEyLjY2NjdDMTAuMTczNiAxMi42NjY3IDEyLjAwMTYgMTEuMTgwMSAxMi41MTk3IDkuMTY3MTZMMTMuODEwOSA5LjQ5OTVDMTMuMTQ0OSAxMi4wODcyIDEwLjc5NjcgMTQgOCAxNEM0LjY4NjI5IDE0IDIgMTEuMzEzNyAyIDhDMiA0LjY4NjI5IDQuNjg2MjkgMiA4IDJDOS44ODU1NCAyIDExLjU2NzEgMi44Njk2NCAxMi42NjY3IDQuMjI4NjZWMi42NjY2N0gxNFY2LjY2NjY3SDEwVjUuMzMzMzNIMTEuODMwNEMxMC45ODY3IDQuMTIzNzggOS41ODUxMiAzLjMzMzMzIDggMy4zMzMzM1oiIGZpbGwtcnVsZT0iZXZlbm9kZCIgY2xpcC1ydWxlPSJldmVub2RkIiBmaWxsPSIjMEYxMzFGIi8+CjwvZz4KPC9zdmc+Cg==" alt=""></button></div>
      <div class="actions">${actions}</div>
    </form>
    ${chips ? '<div class="filter-summary">'+chips+act('reset','','清除全部')+'</div>' : ''}
    <div class="table-wrap"><table class="${columns.includes('操作')?'has-actions':''}"><thead><tr>${head}</tr></thead>
    <tbody>${body || '<tr><td class="empty" colspan="'+columns.length+'"><img src="'+asset('empty')+'" alt="">暂无匹配记录</td></tr>'}</tbody></table></div>
    ${pagination(rows.length,page,pages,size)}
  </div>`;
}

function pagination(total,page,pages,size){
  const controls = [];
  for(let n=1;n<=pages;n++){
    if(n===1 || n===pages || Math.abs(n-page)<=1){
      controls.push('<button type="button" data-act="page" data-id="'+n+'" aria-label="第 '+n+' 页" '+(n===page?'aria-current="page"':'')+'>'+n+'</button>');
    }else if(n===2 || n===pages-1){controls.push('<span>…</span>');}
  }
  return `<nav class="pager" aria-label="列表分页"><span>共 ${total} 条</span>
    <button data-act="page" data-id="${page-1}" aria-label="上一页" ${page===1?'disabled':''}>‹</button>
    ${controls.join('')}
    <button data-act="page" data-id="${page+1}" aria-label="下一页" ${page===pages?'disabled':''}>›</button>
    <select data-filter="size" aria-label="每页条数">${[10,20,50].map(n=>'<option value="'+n+'" '+(n===size?'selected':'')+'>'+n+'条/页</option>').join('')}</select>
    <form class="jump"><label>前往 <input aria-label="跳转页码" type="number" required min="1" max="${pages}"></label></form></nav>`;

}
let observer;
function render(){
  observer?.disconnect(); closeMenu();renderTabs();
  const {tab,params}=route();
  $('#view').innerHTML=tab==='overview'?graphView():listView(tab,params);
  if(tab==='overview'){
    drawLines();observer=new ResizeObserver(()=>drawLines());observer.observe($('.graph'));
  }
}
function detail(title,body){
  $('#drawer-body').innerHTML='<div class="drawer-top"><h2 id="drawer-title">'+escapeText(title)+'</h2>'+act('close-drawer','','×','x')+'</div>'+body;
  $('#drawer .x').setAttribute('aria-label','关闭详情');
  if(!$('#drawer').open) $('#drawer').showModal();
}
function facts(entries){
  return '<dl>'+entries.map(([k,v])=>'<dt>'+k+'</dt><dd>'+escapeText(v)+'</dd>').join('')+'</dl>';
}
function siteDetail(id){
  const site=siteById(id), packages=installed(id);
  detail(site.name,facts([['边端编号',site.code],['在线状态',site.online?'在线':'离线'],['服务地址',site.address+':8000']])+'<h3>已装载模式包（'+packages.length+'）</h3>'+(packages.length?'<table><thead><tr><th>模式包 / 版本</th><th>装入时间</th></tr></thead><tbody>'+packages.map(t=>{
    const p=packageById(t.pkg);
    return '<tr><td>'+escapeText(p.name)+'<small class="meta">'+p.id+' · '+p.version+'</small></td><td>'+t.loaded+'</td></tr>';
  }).join('')+'</tbody></table>':'<p class="meta">本站暂无已装载模式包</p>')+'<h3>分发记录</h3>'+act('site-tasks',id,'查看本站分发任务'));
}
function packageDetail(id){
  const p=packageById(id);
  detail(p.name,facts([['模式包编号',id],['版本',p.version],['来源场景',p.scene],['快照实例',p.count+' 条'],['已装载边端',destinations(id).map(s=>s.name).join('、')||'暂无']])+
    '<div class="actions">'+act('dispatch',id,'下发模式包','btn primary')+act('download',id,'下载 ZIP','btn')+'</div>');
}
function reviewDetail(id){
  const r=db.reviews.find(item=>item.id===id);
  detail(r.title,facts([['申请编号',r.id],['来源边端',siteName(r.site)],['缺口类型',r.type],['提交方式',r.source],['提交时间',r.date],['状态',r.reviewed?'已审阅':'待审阅']])+
    '<h3>缺口说明</h3><p>'+escapeText(r.note)+'</p><h3>佐证材料</h3>'+act('materials',id,'下载材料 ZIP','btn')+(r.reviewed?'':'<div class="dialog-foot">'+act('mark',id,'标记为已审阅','primary btn')+'</div>'));
}
function closeMenu(){$('.menu')?.remove();}
function showMenu(button){
  closeMenu();const id=button.dataset.id;
  const el=document.createElement('div');el.className='menu';el.setAttribute('role','group');el.setAttribute('aria-label','节点操作');
  el.innerHTML=(id==='hub'?'':act('site',id,'查看站点信息',''))+act('rename',id,'重命名','')+(id==='hub'?'':act('delete',id,'删除边端','danger'));
  document.body.append(el);
  const rect=button.getBoundingClientRect();
  el.style.left=Math.min(innerWidth-el.offsetWidth-8,rect.left)+'px';
  el.style.top=Math.min(innerHeight-el.offsetHeight-8,rect.bottom+4)+'px';
  el.querySelector('button').focus();
}
function field(label,control){return '<label class="field"><span>'+label+'</span>'+control+'</label>';}
function options(rows){return rows.map(([v,label])=>'<option value="'+escapeText(v)+'">'+escapeText(label)+'</option>').join('');}
function edit(action,id){
  const site=siteById(id);
  const titles={rename:'重命名',delete:'删除边端',generate:'生成模式包',dispatch:'下发模式包',upload:'上传模式包'};
  let body='',label='保存';
  if(action==='rename') body=field('显示名称','<input required maxlength="36" name="name" value="'+escapeText(id==='hub'?db.hub:site.name)+'">');
  if(action==='delete'){
    label='删除边端';body='<p>从中心端移除「'+escapeText(site.name)+'」的注册记录及图谱连线？历史分发任务与扩模申请将保留。</p>';
  }
  if(action==='generate'){
    body=field('模式包名称','<input required maxlength="40" name="name" placeholder="输入模式包名称">')+field('来源场景','<select name="scene">'+options([['民航离港','民航离港'],['民用应急指挥','民用应急指挥']])+'</select>')+field('基线快照','<select name="base"><option>1.0.1</option><option>1.0.0</option></select>');label='生成';
  }
  if(action==='dispatch'){
    if(!db.sites.length){notice('暂无可接收模式包的边端');return;}
    body=field('模式包',id?'<strong>'+escapeText(packageById(id).name)+' · '+id+'</strong>':'<select name="pkg">'+options(db.packages.map(p=>[p.id,p.name+' · '+p.version]))+'</select>')+
      field('目标边端','<select name="site">'+options(db.sites.map(s=>[s.id,s.name+' · '+(s.online?'在线':'离线')]))+'</select>');label='确认下发';
  }
  if(action==='upload'){body=field('模式包 ZIP','<input type="file" name="archive" accept=".zip" required>');label='上传';}
  ui.modal={action,id};$('#form-body').innerHTML='<h2 id="modal-title">'+titles[action]+'</h2>'+body+'<p id="form-error" class="danger" role="alert"></p>';
  $('#submit').textContent=label;$('#submit').classList.toggle('danger-btn',action==='delete');
  $('#modal').showModal();
}
function nextId(prefix,items){
  const n=1+Math.max(0,...items.map(p=>Number(p.id.split('-')[1])));
  return prefix+'-'+String(n).padStart(3,'0');
}
async function saveZip(name,files){
  const zip=new JSZip();
  for(const [key,value] of Object.entries(files))zip.file(key,value);
  const blob=await zip.generateAsync({type:'blob'}), url=URL.createObjectURL(blob);
  const link=document.createElement('a');link.href=url;link.download=name;link.click();setTimeout(()=>URL.revokeObjectURL(url),1500);
}
async function downloadPack(id){
  const p=packageById(id);
  const metadata=p.metadata||{kind:'mode-package',name:p.name,ver:p.version,basedOnVersion:p.base||'1.0.1',sceneId:p.scene==='民航离港'?184:143,selection:{objectTypes:['Record 业务记录']}};
  const csv=p.csv??('id,objectType\n'+Array.from({length:p.count},(_,i)=>'SAMPLE-'+(i+1)+',Record').join('\n'));
  await saveZip(id+'.zip',{'mode-package.json':JSON.stringify(metadata,null,2),'instances.csv':csv,'README.txt':'本体分发交互原型示例包'});
}
async function readArchive(file){
  if(file.size>4*1024*1024)throw Error('本地原型支持 4 MB 以内的示例包');
  const zip=await JSZip.loadAsync(file);
  const entry=zip.file('mode-package.json');
  if(!entry)throw Error('压缩包缺少 mode-package.json');
  const meta=JSON.parse(await entry.async('string'));
  if(meta.kind!=='mode-package'||typeof meta.name!=='string'||!meta.name.trim()||typeof meta.ver!=='string'||!/^\d+\.\d+\.\d+$/.test(meta.ver)||(!Number.isInteger(meta.sceneId)||meta.sceneId<1))throw Error('请检查模式包类型、名称、版本和场景编号');
  const csv=await zip.file('instances.csv')?.async('string')||'';
  return {id:nextId('P',db.packages),name:meta.name,version:meta.ver,scene:({143:'民用应急指挥',184:'民航离港'})[meta.sceneId]||'场景 '+String(meta.sceneId),count:csv?Math.max(0,csv.trim().split(/\r?\n/).length-1):(Array.isArray(meta.instances)?meta.instances.length:0),metadata:meta,csv};
}
$('#edit-form').addEventListener('submit',async event=>{
  event.preventDefault();
  const {action,id}=ui.modal, form=new FormData(event.target);
  const name=String(form.get('name')||'').trim();
  if((action==='rename'||action==='generate')&&!name){$('#form-error').textContent='请输入名称';return;}
  $('#submit').disabled=true;
  try {
    let next='';
    if(action==='rename'){if(id==='hub')db.hub=name;else siteById(id).name=name;}
    if(action==='delete'){
      db.tasks.filter(t=>t.site===id).forEach(t=>{t.siteName=siteById(id).name;});
      db.sites=db.sites.filter(s=>s.id!==id);
    }
    if(action==='generate')db.packages.unshift({id:nextId('P',db.packages),name,scene:form.get('scene'),version:'1.0.0',count:0,base:form.get('base')});
    if(action==='upload')db.packages.unshift(await readArchive(form.get('archive')));
    if(action==='dispatch'){
      const site=siteById(form.get('site')),pkg=id||form.get('pkg');
      const now=new Date(),pad=v=>String(v).padStart(2,'0');
      const sent=now.getFullYear()+'-'+pad(now.getMonth()+1)+'-'+pad(now.getDate())+' '+pad(now.getHours())+':'+pad(now.getMinutes());
      db.tasks.push({id:nextId('T',db.tasks),site:site.id,pkg,status:site.online?'已提交':'等待安装',sent,loaded:''});next='tasks';
    }
    $('#modal').close();if($('#drawer').open)$('#drawer').close();
    save();if(next)go(next);render();notice(({rename:'名称已更新',delete:'已移除边端',generate:'已生成模式包',upload:'已导入模式包',dispatch:'已创建本地分发任务'})[action]);
  }catch(err){$('#form-error').textContent=action==='upload'?'无法导入示例包。'+err.message:err.message;}
  finally{$('#submit').disabled=false;}
});
function applyFilter(key,value){
  const {tab,params}=route();if(value)params.set(key,value);else params.delete(key);
  if(key!=='page')params.delete('page');
  go(tab,Object.fromEntries(params));
}
document.addEventListener('submit',e=>{if(e.target.matches('.jump')){e.preventDefault();applyFilter('page',e.target.querySelector('input').value);}
  if(e.target.id==='filters'){e.preventDefault();applyFilter('q',$('#q').value.trim());}});
document.addEventListener('change',e=>{if(e.target.dataset.filter)applyFilter(e.target.dataset.filter,e.target.value);});
document.addEventListener('search',e=>{if(e.target.id==='q')applyFilter('q',e.target.value.trim());},true);
document.addEventListener('click',async event=>{
  const button=event.target.closest('[data-act]'),action=button?.dataset.act,id=button?.dataset.id;
  if(action!=='menu')closeMenu();
  if(!button)return;
  if(action==='menu'){showMenu(button);return;}
  if(action==='expand'){ui.expanded=!ui.expanded;ui.selected='';render();$('.pack-toggle').focus({preventScroll:true});return;}
  if(action==='highlight'){ui.selected=ui.selected===id?'':id;drawLines();return;}
  if(action==='site')siteDetail(id);
  if(action==='package')packageDetail(id);
  if(action==='review')reviewDetail(id);
  if(action==='close-drawer')$('#drawer').close();
  if(action==='close-modal')$('#modal').close();
  if(action==='site-tasks'){if($('#drawer').open)$('#drawer').close();go('tasks',{site:id,status:button.dataset.status});}
  if(action==='page')applyFilter('page',id);
  if(action==='clear-filter')applyFilter(id,'');
  if(action==='reset')go(route().tab,{size:route().params.get('size')});
  if(action==='refresh'){readSavedData();render();notice('列表已刷新');}
  if(['generate','delete','dispatch','rename','upload'].includes(action))edit(action,id);
  if(action==='download')await downloadPack(id);
  if(action==='materials'){const r=db.reviews.find(r=>r.id===id);await saveZip(id+'-材料.zip',{'缺口说明.txt':r.title+'\n'+r.note});}
  if(action==='mark'){db.reviews.find(r=>r.id===id).reviewed=true;save();render();reviewDetail(id);}
});
$('#view').addEventListener('pointerover',e=>{const p=e.target.closest('.pack-row');if(p&&!ui.selected)drawLines(p.dataset.id);});
$('#view').addEventListener('pointerout',e=>{if(e.target.closest('.pack-row')&&!e.relatedTarget?.closest?.('.pack-row'))drawLines();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeMenu();ui.selected='';drawLines();}});
document.addEventListener('scroll',closeMenu,true);
$('#fold').onclick=()=>{document.body.classList.toggle('collapsed');$('#fold').setAttribute('aria-label',document.body.classList.contains('collapsed')?'展开导航':'收起导航');};
for(const d of document.querySelectorAll('dialog'))d.addEventListener('click',e=>{
  if(e.target!==d)return;const b=d.getBoundingClientRect();if(e.clientX<b.left||e.clientX>b.right||e.clientY<b.top||e.clientY>b.bottom)d.close();
});
window.addEventListener('hashchange',()=>{if($('#drawer').open)$('#drawer').close();if($('#modal').open)$('#modal').close();render();});
render();
</script>
</body>
